name: Release

# Runs when a version tag (v1.2.0) is pushed. Checks the tag matches package.json,
# runs the full check, then creates a GitHub Release using that version's notes
# from CHANGELOG.md. Publishing the site itself is handled by ci.yml on main.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Tag matches package.json
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($PKG)"; exit 1
          fi

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No '## $VERSION' section in CHANGELOG.md"; exit 1
          fi

      - name: Zip the built app
        run: cd dist && zip -r "../slate-${GITHUB_REF_NAME}.zip" .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "slate-${GITHUB_REF_NAME}.zip" --title "Slate ${GITHUB_REF_NAME}" --notes-file notes.md
